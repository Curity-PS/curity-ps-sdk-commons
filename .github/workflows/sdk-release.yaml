# This workflow will build a curity-sdk-commons with Maven

name: Build & Release Curity SDK Commmons Lib

on:
  workflow_dispatch:

jobs:
  release:
    uses: curity-ps/release-workflow/.github/workflows/release.yml@main
    permissions: write-all
    with:
      skip_integration_test: true
    secrets:
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.skipped == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish package
        run: ./gradlew publish -Pversion=${{ needs.release.outputs.version }}
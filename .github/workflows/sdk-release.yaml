# This workflow will build a curity-sdk-commons with Maven

name: Build & Release Curity SDK Commmons Lib

on:
  workflow_dispatch:

jobs:
  build_and_package:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Copy plugin jars
        run: mkdir staging && cp build/libs/*.jar staging

      - name: Build plugin artifacts zip
        run: |
          zip --junk-paths plugin-artifacts staging/*

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts.zip
          path: plugin-artifacts.zip

  make_release:
    runs-on: ubuntu-latest
    needs: build_and_package
    permissions: write-all

    steps:
      - name: Download code
        uses: actions/checkout@v3

      - name: Fetch release version from tags
        run: |
          VERSION=$(./it tag -l | head -n 1')
          echo "Current Version: $VERSION"
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Conventional changelog action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-on-empty: "false"
          skip-tag: "true"
          skip-commit: 'true'
          output-file: false
          fallback-version: ${{ env.CURRENT_VERSION }}

      - name: Fetch new version
        run: |
          NEW_VERSION=${{ steps.changelog.outputs.version }}
          echo "Creating new version: $NEW_VERSION"
          echo NEW_VERSION=$NEW_VERSION >> $GITHUB_ENV

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-artifacts.zip

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.NEW_VERSION }}
          release_name: ${{ env.NEW_VERSION }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./plugin-artifacts.zip
          asset_name: plugin-artifacts.zip
          asset_content_type: application/zip
      - name: Publish package
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in build.gradle
        run: |
          sed -i "s/^version *= *.*/version = '$NEW_VERSION'/" build.gradle

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: Update version to ${{ env.NEW_VERSION }}"

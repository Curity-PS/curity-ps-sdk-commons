plugins {
    id 'java-library'
}

group = 'io.curity'
version = '1.0-SNAPSHOT'
java.sourceCompatibility = JavaVersion.VERSION_21

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'se.curity.identityserver:identityserver.sdk:10.0.0'

    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.bitbucket.b_c:jose4j:0.9.3'

    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:RELEASE'
    testImplementation 'org.wiremock:wiremock:3.12.0'
    testImplementation('com.github.jknack:handlebars-helpers:4.3.1') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'org.mozilla', module: 'rhino'
    }
}

test {
    useJUnitPlatform()
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

task deployToLocal(type: Copy) {
    dependsOn jar
    from configurations.runtimeClasspath
    from jar
    into "${System.env.IDSVR_HOME}/usr/share/plugins/$project.name"
}
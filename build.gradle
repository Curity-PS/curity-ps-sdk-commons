plugins {
    id 'java-library'
    id 'groovy'
    id 'maven-publish'
}

group = 'io.curity'
version = '0.4.0'

repositories {
    mavenCentral()
}

publishing {
    repositories {
        maven {
            name = "CurityPsPackages"
            url = "https://maven.pkg.github.com/curity-ps/curity-ps-sdk-commons"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }

    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}

dependencies {
    compileOnly 'se.curity.identityserver:identityserver.sdk:10.2.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.12'

    api('org.bitbucket.b_c:jose4j:0.9.6') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'se.curity.identityserver:identityserver.sdk:10.2.0'
    testImplementation 'org.spockframework:spock-core:2.4-M4-groovy-4.0'
    testImplementation 'org.bitbucket.b_c:jose4j:0.9.6'
    testImplementation 'org.testcontainers:testcontainers:2.0.3'
    testImplementation 'org.slf4j:slf4j-api:2.0.12'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.javadoc {
    exclude '**/*Configuration.java'
}


tasks.register('testJar', Jar) {
    archiveClassifier = 'tests'
    from sourceSets.test.output
}

publishing {
    publications {
        gpr {
            artifact(tasks.testJar)
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}